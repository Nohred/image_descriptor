<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Búsqueda de imágenes</title>
  <style>
    :root { color-scheme: light; --ink: #172033; --muted: #64748b; --line: #e2e8f0; --accent: #635bff; --accent-dark: #4f46e5; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: linear-gradient(135deg, #f8fafc, #eef2ff); }
    .shell { max-width: 1240px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    header { margin-bottom: 2rem; }
    .eyebrow { color: var(--accent); font-size: .75rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: .4rem 0 .65rem; font-size: clamp(2rem, 5vw, 3.4rem); letter-spacing: -.05em; }
    .intro { max-width: 650px; margin: 0; color: var(--muted); line-height: 1.6; }
    .search-panel { padding: 1.25rem; border: 1px solid rgba(255,255,255,.8); border-radius: 1.25rem; background: rgba(255,255,255,.82); box-shadow: 0 20px 50px rgba(30, 41, 59, .1); }
    form { display: grid; grid-template-columns: minmax(260px, 1fr) 150px 120px auto; gap: .85rem; align-items: end; }
    label { display: flex; flex-direction: column; gap: .4rem; color: #475569; font-size: .8rem; font-weight: 750; }
    input, select, button { width: 100%; min-height: 2.8rem; border: 1px solid var(--line); border-radius: .65rem; padding: .65rem .8rem; font: inherit; color: var(--ink); background: #fff; }
    input:focus, select:focus { outline: 3px solid rgba(99,91,255,.18); border-color: var(--accent); }
    button { border: 0; color: #fff; font-weight: 750; background: var(--accent); cursor: pointer; transition: transform .15s, background .15s; }
    button:hover { background: var(--accent-dark); transform: translateY(-1px); }
    button:disabled { opacity: .65; cursor: wait; transform: none; }
    #message { min-height: 1.5rem; margin: 1.25rem 0 .5rem; color: #b42318; font-weight: 650; }
    .summary-row { display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 2.5rem; margin: 1.5rem 0 .8rem; }
    #summary { margin: 0; color: var(--muted); font-size: .9rem; }
    .results { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 1.25rem; }
    article { overflow: hidden; border: 1px solid rgba(226,232,240,.9); border-radius: 1rem; background: rgba(255,255,255,.92); box-shadow: 0 8px 24px rgba(30,41,59,.07); transition: transform .2s, box-shadow .2s; }
    article:hover { transform: translateY(-3px); box-shadow: 0 16px 30px rgba(30,41,59,.13); }
    article img, .image-missing { display: block; width: 100%; height: 205px; object-fit: cover; background: #e2e8f0; }
    .image-missing { display: grid; place-items: center; color: var(--muted); font-size: .85rem; }
    article pre { margin: 0; padding: 1rem; white-space: pre-wrap; overflow-wrap: anywhere; color: #475569; font: .82rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .meta { display: flex; justify-content: space-between; gap: .5rem; padding: .9rem 1rem 0; font-size: .82rem; font-weight: 750; }
    .badge { flex: 0 0 auto; padding: .2rem .45rem; border-radius: 999px; color: #4338ca; background: #eef2ff; font-size: .7rem; }
    @media (max-width: 760px) { .shell { padding-top: 2rem; } form { grid-template-columns: 1fr 1fr; } form label:first-child { grid-column: 1 / -1; } form button { grid-column: 1 / -1; } }
    @media (max-width: 420px) { form { grid-template-columns: 1fr; } form label:first-child, form button { grid-column: auto; } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="eyebrow">Image descriptors</div>
      <h1>Encuentra el vehículo que buscas</h1>
      <p class="intro">Explora tus imágenes con filtros de atributos, similitud semántica o una combinación de ambos.</p>
    </header>
    <section class="search-panel">
      <form id="search-form">
        <label>Consulta en lenguaje natural <input id="query" type="text" required placeholder="Ej. autos rojos que no sean hatchback"></label>
        <label>Modo
          <select id="mode">
            <option value="fixed">fixed · filtros</option>
            <option value="semantic">semantic · similitud</option>
            <option value="hybrid">hybrid · combinado</option>
          </select>
        </label>
        <label>Máximo de resultados <input id="limit" type="number" min="1" max="100" value="20"></label>
        <button id="submit-button" type="submit">Buscar imágenes</button>
      </form>
      <div id="message" role="status"></div>
    </section>
    <div class="summary-row"><p id="summary"></p></div>
    <main id="results" class="results"></main>
  </div>
  <script>
    const form = document.querySelector("#search-form");
    const message = document.querySelector("#message");
    const summary = document.querySelector("#summary");
    const results = document.querySelector("#results");
    const submitButton = document.querySelector("#submit-button");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Buscando...";
      summary.textContent = "";
      results.replaceChildren();
      submitButton.disabled = true;
      try {
        const response = await fetch("/api/search", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            query: document.querySelector("#query").value,
            mode: document.querySelector("#mode").value,
            limit: Number(document.querySelector("#limit").value)
          })
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "La búsqueda falló.");
        message.textContent = "";
        summary.textContent = `${data.candidates.length} resultados · ${data.total} considerados · ${data.elapsed_ms.toFixed(1)} ms`;
        for (const candidate of data.candidates) {
          const card = document.createElement("article");
          if (candidate.image_url) {
            const image = document.createElement("img");
            image.src = candidate.image_url;
            image.alt = candidate.image_id;
            card.append(image);
          } else {
            const missing = document.createElement("div");
            missing.className = "image-missing";
            missing.textContent = "Imagen no disponible";
            card.append(missing);
          }
          const meta = document.createElement("div");
          meta.className = "meta";
          const name = document.createElement("span");
          name.textContent = candidate.image_id;
          meta.append(name);
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = candidate.source;
          meta.append(badge);
          card.append(meta);
          const details = document.createElement("pre");
          details.textContent = JSON.stringify({
            score: candidate.score,
            ...candidate.attributes,
            ...(candidate.image_error ? {image_error: candidate.image_error} : {})
          }, null, 2);
          card.append(details);
          results.append(card);
        }
      } catch (error) {
        message.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
